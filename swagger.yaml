openapi: 3.0.3
info:
  title: 꽃필무렵 (Floral Stories) API
  description: 꽃 정보 및 검색 서비스 API
  version: 2.0.1
  contact:
    name: API Support
    email: support@floralstories.com

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증 관련 API
  - name: Flowers
    description: 꽃 정보 API
  - name: Search
    description: 검색 API
  - name: Favorites
    description: 즐겨찾기 API
  - name: View History
    description: 조회 기록 API
  - name: Shops
    description: 꽃집 API

paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: 신규 회원 가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - nickname
                - userName
                - userBirth
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password123
                nickname:
                  type: string
                  example: 꽃사랑
                userName:
                  type: string
                  example: 홍길동
                userBirth:
                  type: string
                  pattern: '^[0-9]{8}$'
                  example: "19900101"
      responses:
        '200':
          description: 회원가입 성공
          content:
            text/plain:
              schema:
                type: string
                example: 회원가입 완료
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일과 비밀번호로 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIs...
                  refreshToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIs...
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 토큰 재발급
      description: Refresh Token으로 새로운 Access Token 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIs...
      responses:
        '200':
          description: 토큰 재발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      description: 로그아웃 및 토큰 무효화
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 로그아웃 성공
          content:
            text/plain:
              schema:
                type: string
                example: 로그아웃 완료
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/find-email:
    post:
      tags:
        - Auth
      summary: 이메일 찾기
      description: 이름과 생년월일로 이메일 찾기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - userBirth
              properties:
                userName:
                  type: string
                  example: 홍길동
                userBirth:
                  type: string
                  example: "19900101"
      responses:
        '200':
          description: 이메일 찾기 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    example: user@example.com
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: 비밀번호 재설정
      description: 임시 비밀번호 발송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - email
              properties:
                userName:
                  type: string
                  example: 홍길동
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: 임시 비밀번호 발송 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 임시 비밀번호가 이메일로 발송되었습니다.
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/check-email:
    post:
      tags:
        - Auth
      summary: 이메일 중복 확인
      description: 이메일 사용 가능 여부 확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: 확인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 이미 사용 중인 이메일입니다.

  /auth/check-nickname:
    post:
      tags:
        - Auth
      summary: 닉네임 중복 확인
      description: 닉네임 사용 가능 여부 확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nickname
              properties:
                nickname:
                  type: string
                  example: 꽃사랑
      responses:
        '200':
          description: 확인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 사용 가능한 닉네임입니다.

  /flowers:
    get:
      tags:
        - Flowers
      summary: 전체 꽃 목록 조회
      description: 모든 꽃 정보 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowerSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flowers/today:
    get:
      tags:
        - Flowers
      summary: 오늘의 꽃 조회
      description: 오늘의 꽃 상세 정보 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowerDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flowers/season:
    get:
      tags:
        - Flowers
      summary: 계절별 꽃 조회
      description: 특정 계절의 꽃 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: string
            enum: [spring, summer, autumn, winter]
          description: 계절
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowerSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flowers/{flowerId}:
    get:
      tags:
        - Flowers
      summary: 꽃 상세 정보 조회
      description: 특정 꽃의 상세 정보 조회 (즐겨찾기 여부 포함)
      security:
        - bearerAuth: []
      parameters:
        - name: flowerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 꽃 ID
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowerDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /flowers/keyword:
    get:
      tags:
        - Flowers
      summary: 키워드로 꽃 검색
      description: 꽃 키워드로 검색
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 검색 키워드
          example: 사랑
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowerSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flowers/search:
    get:
      tags:
        - Flowers
      summary: 꽃 이름 검색
      description: 꽃 이름으로 검색 (부분 일치)
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: 꽃 이름
          example: 장미
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowerSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /search:
    post:
      tags:
        - Search
      summary: 시맨틱 검색
      description: AI 기반 의미 검색 및 검색어 저장
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: 검색어
          example: 친구 졸업 축하
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: number
                  format: float
                description: 임베딩 벡터
        '401':
          $ref: '#/components/responses/Unauthorized'

  /search/recent:
    get:
      tags:
        - Search
      summary: 최근 검색어 조회
      description: 사용자의 최근 검색어 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["부모님 생신", "화이트데이", "졸업 축하"]
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Search
      summary: 검색어 삭제
      description: 특정 검색어 삭제
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: 삭제할 검색어
      responses:
        '200':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'

  /search/recent/all:
    delete:
      tags:
        - Search
      summary: 검색어 전체 삭제
      description: 모든 검색어 기록 삭제
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favorites:
    get:
      tags:
        - Favorites
      summary: 즐겨찾기 목록 조회
      description: 사용자의 즐겨찾기 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Favorites
      summary: 즐겨찾기 추가
      description: 꽃을 즐겨찾기에 추가
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - flowerId
              properties:
                flowerId:
                  type: integer
                  format: int64
                  example: 1
      responses:
        '200':
          description: 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favorites/{flowerId}:
    delete:
      tags:
        - Favorites
      summary: 즐겨찾기 삭제
      description: 즐겨찾기에서 꽃 삭제
      security:
        - bearerAuth: []
      parameters:
        - name: flowerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 꽃 ID
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 즐겨찾기에서 삭제되었습니다.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favorites/check/{flowerId}:
    get:
      tags:
        - Favorites
      summary: 즐겨찾기 여부 확인
      description: 특정 꽃의 즐겨찾기 여부 확인
      security:
        - bearerAuth: []
      parameters:
        - name: flowerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 꽃 ID
      responses:
        '200':
          description: 확인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  isFavorite:
                    type: boolean
                    example: true
                  favoriteId:
                    type: integer
                    format: int64
                    example: 1
        '401':
          $ref: '#/components/responses/Unauthorized'

  /view-history:
    get:
      tags:
        - View History
      summary: 조회 기록 목록
      description: 사용자의 꽃 조회 기록 목록
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - View History
      summary: 조회 기록 저장
      description: 꽃 조회 기록 저장
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - flowerId
              properties:
                flowerId:
                  type: integer
                  format: int64
                  example: 1
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 조회 기록이 저장되었습니다.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - View History
      summary: 조회 기록 전체 삭제
      description: 모든 조회 기록 삭제
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 모든 조회 기록이 삭제되었습니다.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /view-history/{viewId}:
    delete:
      tags:
        - View History
      summary: 조회 기록 삭제
      description: 특정 조회 기록 삭제
      security:
        - bearerAuth: []
      parameters:
        - name: viewId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 조회 기록 ID
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 조회 기록이 삭제되었습니다.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /shops/nearby:
    get:
      tags:
        - Shops
      summary: 주변 꽃집 검색
      description: 카카오 지도 API를 통한 주변 꽃집 검색
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          description: 위도
          example: 37.567143916618885
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
          description: 경도
          example: 126.97789378754335
        - name: radius
          in: query
          required: false
          schema:
            type: integer
            default: 1000
            maximum: 20000
          description: 검색 반경 (미터)
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            default: 꽃집
          description: 검색 키워드
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /test/deepseek/embedding:
    post:
      tags:
        - Search
      summary: 꽃 추천 검색 임베딩 생성
      description: |
        검색어를 의미 기반으로 해석하여 임베딩 벡터를 생성합니다.
        검색어 → 의미 해석 → 의미 문장 생성 → Ollama 로컬 임베딩 벡터 생성
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: 사용자 검색어
          example: 졸업하는 친구에게 줄 꽃 추천
      responses:
        '200':
          description: 임베딩 벡터 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cards/message:
    post:
      tags:
        - Flowers
      summary: 카드 메시지 생성
      description: |
        선택한 꽃과 꽃말, 상황을 기반으로 카드 메시지를 AI로 생성합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardMessageRequest'
      responses:
        '200':
          description: 카드 메시지 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Access Token

  schemas:
    FlowerSummary:
      type: object
      properties:
        flowerId:
          type: integer
          format: int64
          example: 725
        flowerName:
          type: string
          example: 힙노시스 카네이션
        floriography:
          type: array
          items:
            type: string
          example: ["존경"]
        flowerKeyword:
          type: array
          items:
            type: string
          example: ["경의", "배려", "감사"]
        imageUrl:
          type: string
          format: uri
          example: https://example.com/image.jpg
        season:
          type: array
          items:
            type: string
            enum: [spring, summer, autumn, winter]
          example: ["spring", "summer"]

    FlowerDetail:
      allOf:
        - $ref: '#/components/schemas/FlowerSummary'
        - type: object
          properties:
            flowerOrigin:
              type: string
              example: 더글라스는 북아메리카 서부가 원산지로...
            flowerDescribe:
              type: string
              example: 꽃말로는 '순결'과 '영원한 우정'을 의미하며...
            todayFlower:
              type: string
              format: date
              nullable: true
              example: "2026-01-16"
            isFavorite:
              type: boolean
              example: false

    Favorite:
      type: object
      properties:
        favoriteId:
          type: integer
          format: int64
          example: 1
        flowerId:
          type: integer
          format: int64
          example: 1
        flowerName:
          type: string
          example: 프리지아
        floriography:
          type: array
          items:
            type: string
          example: ["신뢰와 우정"]
        imageUrl:
          type: string
          format: uri
          example: https://example.com/image.jpg
        createdAt:
          type: string
          format: date-time
          example: "2026-01-16T10:00:00"

    ViewHistory:
      type: object
      properties:
        viewId:
          type: integer
          format: int64
          example: 1
        flowerId:
          type: integer
          format: int64
          example: 1
        flowerName:
          type: string
          example: 프리지아
        imageUrl:
          type: string
          format: uri
          example: https://example.com/image.jpg
        createdAt:
          type: string
          format: date-time
          example: "2026-01-16T14:30:00"

    Shop:
      type: object
      properties:
        name:
          type: string
          example: 이일플라워
        address:
          type: string
          example: 서울 중구 세종대로 124
        lat:
          type: number
          format: double
          example: 37.567143916618885
        lng:
          type: number
          format: double
          example: 126.97789378754335
        distance:
          type: integer
          description: 거리 (미터)
          example: 71
        phone:
          type: string
          example: 1588-1943
        placeUrl:
          type: string
          format: uri
          example: http://place.map.kakao.com/2062274720

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 401
        message:
          type: string
          example: 유효하지 않은 토큰입니다.

    EmbeddingResponse:
      type: object
      required:
        - semanticQuery
        - vectorLength
        - vectorPreview
      properties:
        semanticQuery:
          type: string
          description: 의미 토큰 기반 생성된 검색 문장
          example: 축하 따뜻한 졸업 친구
        vectorLength:
          type: integer
          description: 임베딩 벡터 차원 수
          example: 768
        vectorPreview:
          type: array
          description: 임베딩 벡터 일부 미리보기
          items:
            type: number
            format: float
          example: [-0.0123, 0.0841, -0.0342, 0.0194]

    CardMessageRequest:
      type: object
      required:
        - flowerName
        - floriography
        - query
      properties:
        flowerName:
          type: string
          description: 사용자가 선택한 꽃 이름
          example: 프리지아
        floriography:
          type: array
          description: 해당 꽃의 꽃말
          items:
            type: string
          example: ["순수", "우정"]
        query:
          type: string
          description: 상황 / 의도 문장 (프론트에서 전달)
          example: 졸업 축하

    CardMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: 생성된 카드 메시지
          example: 순수한 우정을 상징하는 프리지아처럼, 앞으로의 길도 맑고 빛나길 바랍니다. 졸업을 진심으로 축하합니다.

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status: 400
            message: 잘못된 요청입니다.

    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status: 401
            message: 유효하지 않은 토큰입니다.

    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status: 403
            message: 접근 권한이 없습니다.

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status: 404
            message: 요청한 리소스를 찾을 수 없습니다.

    InternalServerError:
      description: 서버 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status: 500
            message: 서버 오류가 발생했습니다.
