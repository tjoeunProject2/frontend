openapi: 3.0.3
info:
  title: Auth API
  version: 1.0.0
  description: |
    AUTH API 명세 (회원가입/로그인/토큰재발급/로그아웃/이메일찾기/중복확인)

servers:
  - url: http://localhost:8080/api
    description: Local

tags:
  - name: Auth
    description: 인증/회원 관련

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignupRequest:
      type: object
      required: [email, password, nickname, userName, userBirth]
      properties:
        email:
          type: string
          format: email
          example: test@test.com
        password:
          type: string
          example: "1234"
        nickname:
          type: string
          example: tester
        userName:
          type: string
          example: 테스트
        userBirth:
          type: string
          description: 생년월일(YYYYMMDD)
          example: "19990101"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: test@test.com
        password:
          type: string
          example: "1234"

    TokenResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    LogoutResponse:
      type: string
      example: 로그아웃 완료

    SignupResponse:
      type: string
      example: 회원가입 완료

    FindEmailRequest:
      type: object
      required: [userName, userBirth]
      properties:
        userName:
          type: string
          example: 테스트
        userBirth:
          type: string
          description: 생년월일(YYYYMMDD)
          example: "19990101"

    FindEmailResponse:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: test@test.com

    CheckEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: test@test.com

    CheckNicknameRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          example: tester

    ExistsResponse:
      type: object
      required: [exists, message]
      properties:
        exists:
          type: boolean
          example: true
        message:
          type: string
          example: 이미 사용 중인 이메일입니다.

    ErrorResponse:
      type: object
      required: [success, status, message]
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 401
        message:
          type: string
          example: 유효하지 않은 토큰입니다.

  responses:
    UnauthorizedError:
      description: 인증 실패 (토큰 없음/만료/유효하지 않음 등)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidToken:
              value:
                success: false
                status: 401
                message: 유효하지 않은 토큰입니다.

    BadRequestError:
      description: 잘못된 요청 (입력값 오류/중복 등)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            badRequest:
              value:
                success: false
                status: 400
                message: 입력값이 올바르지 않습니다.

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      description: 이메일/비밀번호/닉네임/이름/생년월일로 회원가입합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: 회원가입 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
              examples:
                success:
                  value: 회원가입 완료
        "400":
          $ref: "#/components/responses/BadRequestError"

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: 이메일/비밀번호로 로그인하고 토큰을 발급합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 토큰 발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh Token 재발급
      description: Refresh Token으로 Access/Refresh Token을 재발급합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: Access Token을 사용해 로그아웃 처리합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 로그아웃 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
              examples:
                success:
                  value: 로그아웃 완료
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/find-email:
    post:
      tags: [Auth]
      summary: 이메일 찾기
      description: 이름과 생년월일로 이메일을 조회합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindEmailRequest"
      responses:
        "200":
          description: 이메일 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /auth/check-email:
    post:
      tags: [Auth]
      summary: 이메일 중복 확인
      description: 이메일 사용 가능 여부를 확인합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckEmailRequest"
      responses:
        "200":
          description: 중복 확인 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExistsResponse"
              examples:
                existsTrue:
                  value:
                    exists: true
                    message: 이미 사용 중인 이메일입니다.
                existsFalse:
                  value:
                    exists: false
                    message: 사용 가능한 이메일입니다.

  /auth/check-nickname:
    post:
      tags: [Auth]
      summary: 닉네임 중복 확인
      description: 닉네임 사용 가능 여부를 확인합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckNicknameRequest"
      responses:
        "200":
          description: 중복 확인 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExistsResponse"
              examples:
                existsFalse:
                  value:
                    exists: false
                    message: 사용 가능한 닉네임입니다.
                existsTrue:
                  value:
                    exists: true
                    message: 이미 사용 중인 닉네임입니다.
